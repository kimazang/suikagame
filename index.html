<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1991 만들기 👄</title>
  <meta name="description" content="큐플레이 캐릭터를 합쳐 1991을 만들어 보세요!" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kimazang/suikagame/main/1991_favicon.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kimazang/suikagame/main/1991_favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="1991 만들기 👄" />
  <meta property="og:description" content="큐플레이 캐릭터를 합쳐 1991을 만들어 보세요!" />
  <meta property="og:image" content="https://raw.githubusercontent.com/kimazang/suikagame/main/preview.png" />
  <meta property="og:url" content="https://kimazang.github.io/suikagame/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="1991 만들기 👄" />
  <meta name="twitter:description" content="큐플레이 캐릭터를 합쳐 1991을 만들어 보세요!" />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/kimazang/suikagame/main/preview.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260519-review2" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5ab8e0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="1991" />
</head>
<body>

  <!-- 닉네임 모달 -->
  <div id="nickname-modal" class="overlay hidden">
    <div class="modal-box">
      <div class="modal-emoji">👄</div>
      <h2 class="modal-title">1991 만들기</h2>
      <p class="modal-desc">닉네임을 설정하면 랭킹에 기록돼요.<br>2~10글자로 입력해주세요.</p>
      <input type="text" id="nickname-input" class="nickname-input"
        maxlength="10" placeholder="닉네임 입력" autocomplete="off" />
      <div id="nickname-error" class="error-msg"></div>
      <button id="nickname-confirm-btn" class="btn btn-orange btn-full">시작하기 🚀</button>
    </div>
  </div>

  <!-- 게임오버 모달 -->
  <div id="gameover-modal" class="overlay hidden">
    <div class="modal-box">
      <div class="modal-emoji">😵</div>
      <h2 class="modal-title">GAME OVER</h2>
      <div id="go-player" class="go-player"></div>
      <div class="go-stats-grid">
        <div class="go-stat-item">
          <div class="go-stat-label">이번 큐포인트</div>
          <div id="go-score" class="go-stat-val"></div>
        </div>
        <div class="go-stat-item">
          <div class="go-stat-label">최고 큐포인트</div>
          <div id="go-best" class="go-stat-val gold"></div>
        </div>
        <div class="go-stat-item">
          <div class="go-stat-label">이번 판 1991 기록</div>
          <div id="go-wm" class="go-stat-val"></div>
        </div>
        <div class="go-stat-item">
          <div class="go-stat-label">1991 최고 기록</div>
          <div id="go-best-wm" class="go-stat-val gold"></div>
        </div>
      </div>
      <div id="go-message" class="go-message"></div>
      <div class="go-buttons">
        <button id="go-restart-btn" class="btn btn-orange">🔄 다시 시작</button>
        <button id="go-ranking-btn" class="btn btn-blue">🏆 랭킹 보기</button>
        <button id="go-nickname-btn" class="btn btn-ghost">✏️ 닉네임 변경</button>
      </div>
    </div>
  </div>

  <!-- 모바일 옵션 바텀시트 -->
  <div id="mob-options-panel" class="mob-options-panel hidden">
    <div class="mob-options-header">
      <span>⚙️ 옵션</span>
      <button id="mob-options-close" class="btn btn-ghost btn-sm">✕</button>
    </div>
    <div class="mob-options-body">
      <button id="mob-restart-btn" class="btn btn-orange btn-full">🔄 처음부터</button>
      <button id="mob-change-nick-btn" class="btn btn-ghost btn-full">✏️ 닉네임 변경</button>
    </div>
  </div>

  <!-- PC 타이틀 -->
  <div class="pc-title">👄 1991 만들기</div>

  <!-- 페이지 레이아웃 -->
  <div class="page-wrap">

    <!-- 왼쪽: 점수 + 랭킹 (PC) -->
    <aside class="left-panel panel">
      <div class="player-row">
        <span id="player-display" class="player-name">플레이어: -</span>
      </div>
      <div class="score-card">
        <div class="score-item">
          <div class="score-label">최고 큐포인트</div>
          <div id="best-display" class="score-val gold">0</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-item">
          <div class="score-label">1991 최고 기록 👄</div>
          <div id="best-wm-display" class="score-val gold">0개</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-item">
          <div class="score-label">현재 큐포인트</div>
          <div id="score-display" class="score-val">0</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-item">
          <div class="score-label">이번 판 1991 👄</div>
          <div id="wm-display" class="score-val">0개</div>
        </div>
      </div>
      <div class="panel-logo rank-logo">🏆 TOP 10</div>
      <div id="ranking-list" class="ranking-list"></div>
      <button id="pc-ranking-more-btn" class="rank-more-btn pc-rank-more" type="button">TOP 50</button>
    </aside>

    <!-- 중앙: 게임 -->
    <main class="center-panel">
      <!-- 모바일 정보바 -->
      <div class="mobile-info-bar">
        <div class="mob-score-group">
          <span class="mob-label">큐포</span>
          <span id="mob-score" class="mob-val">0</span>
        </div>
        <div class="mob-score-group">
          <span class="mob-label">최고</span>
          <span id="mob-best" class="mob-val gold">0</span>
        </div>
        <div class="mob-score-group">
          <span class="mob-label">1991👄</span>
          <span id="mob-wm" class="mob-val">0</span>
        </div>
        <!-- 오른쪽: 다음구슬 / 소리 / 옵션 -->
        <div class="mob-right-group">
          <div class="mob-next-group">
            <span class="mob-label">다음</span>
            <img id="mob-next-img" class="mob-next-img" alt="" />
          </div>
          <button id="mob-sound-btn" class="sound-toggle on">🔊 ON</button>
          <button id="mob-options-btn" class="btn btn-ghost btn-sm">⚙️</button>
        </div>
      </div>

      <!-- 캔버스 -->
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- 모바일 하단 버튼 -->
      <div class="mobile-controls">
        <button id="mob-ranking-btn" class="btn btn-blue">
          🏆 랭킹 · <span id="mob-rank-best">0</span>P
        </button>
      </div>

      <!-- 모바일 진화의 고리 -->
      <div class="mobile-evo-wrap">
        <div class="mobile-evo-label">1991 제작법</div>
        <div id="mobile-evolution-row" class="mobile-evolution-row"></div>
      </div>
    </main>

    <!-- 오른쪽: 다음 공 + 진화의 고리 (PC) -->
    <aside class="right-panel panel">
      <div class="next-card">
        <div class="next-label">다음 얼굴</div>
        <div class="next-img-wrap">
          <img id="next-ball-img" class="next-ball-img" alt="다음 공" />
        </div>
      </div>
      <div class="panel-logo">1991 제작법</div>
      <div id="evolution-ring" class="evolution-ring"></div>
      <!-- PC 옵션 버튼들 -->
      <div class="pc-panel-btns">
        <button id="restart-btn" class="btn btn-orange btn-sm btn-full">🔄 처음부터</button>
        <button id="sound-toggle-btn" class="sound-toggle on">🔊 ON</button>
        <button id="change-nickname-btn" class="btn btn-ghost btn-sm btn-full">✏️ 닉네임 변경</button>
      </div>
    </aside>
  </div>

  <!-- 크레딧 -->
  <div class="credit">@kimazang</div>

  <!-- 모바일 랭킹 슬라이드 -->
  <div id="mobile-ranking-panel" class="mobile-ranking-panel hidden">
    <div class="mobile-ranking-header">
      <span>🏆 TOP 10 랭킹</span>
      <div class="mobile-ranking-actions">
        <button id="mob-ranking-more-btn" class="rank-more-btn mob-rank-more" type="button">TOP 50</button>
        <button id="mob-ranking-close" class="btn btn-ghost btn-sm">✕ 닫기</button>
      </div>
    </div>
    <div id="mobile-ranking-list" class="ranking-list"></div>
  </div>


  <!-- TOP 50 전체 랭킹 패널 -->
  <div id="full-ranking-panel" class="full-ranking-panel hidden">
    <div class="full-ranking-card">
      <div class="full-ranking-header">
        <div>
          <div class="full-ranking-title">🏆 TOP 50 랭킹</div>
          <div class="full-ranking-sub">점수순</div>
        </div>
        <button id="full-ranking-close" class="btn btn-ghost btn-sm" type="button">✕ 닫기</button>
      </div>
      <div id="full-ranking-list" class="full-ranking-list">
        <div class="full-ranking-loading">불러오는 중...</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script type="module" src="./game.js?v=0528-fix-1"></script>
  <!-- 서비스워커 등록 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/suikagame/sw.js');
    }
  </script>
</body>
</html>
